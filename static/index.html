<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextComparator</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <h1>TextComparator</h1>

        <div class="text-inputs">

            <div class="input-group">
                <label for="original">Original Text</label>
                <textarea
                    id="original"
                    placeholder="Enter original text..."
                    rows="12"
                ></textarea>
            </div>

            <div class="input-group">
                <label for="modified">Modified Text</label>
                <textarea
                    id="modified"
                    placeholder="Enter modified text..."
                    rows="12"
                ></textarea>
            </div>

        </div>

        <label class="checkbox-label">
            <input
                type="checkbox"
                id="ignore-extra-spaces"
                checked
            >
            Ignore extra spaces
        </label>

        <button id="compare-button">Compare</button>

        <section id="results" class="results" hidden>

            <h2>Comparison Results</h2>

            <div class="stats">
                <p>Added: <span id="added-count">0</span></p>
                <p>Removed: <span id="removed-count">0</span></p>
                <p>Similarity: <span id="similarity">0%</span></p>
            </div>

            <div class="text-inputs">

                <div class="input-group">
                    <h3>Original Text</h3>
                    <div id="original-result" class="result-panel"></div>
                </div>

                <div class="input-group">
                    <h3>Modified Text</h3>
                    <div id="modified-result" class="result-panel"></div>
                </div>

            </div>

        </section>

    </main>

    <script src="/static/script.js"></script>
</body>

</html>
